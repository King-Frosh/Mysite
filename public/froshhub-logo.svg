<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="hubGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Icon Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Hex Background -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#0F172A" stroke="url(#hubGrad)" stroke-width="2.5" />
    
    <!-- Central Geometric F-H Node Grid -->
    <path d="M22 24 H56 C57 24 58 25 58 26 V32 C58 33 57 34 56 34 H34 V42 H50 C51 42 52 43 52 44 V48 C52 49 51 50 50 50 H34 V56 H22 Z" fill="url(#hubGrad)" filter="url(#shadow)"/>
    
    <!-- Connected Hub Branch (representing H & networking) -->
    <path d="M48 38 L62 48 V56 H54 V50 L46 44 Z" fill="url(#hubGlow)" opacity="0.9"/>
    
    <!-- Circuit Nodes -->
    <circle cx="22" cy="24" r="3.5" fill="#38BDF8"/>
    <circle cx="56" cy="24" r="3.5" fill="#A855F7"/>
    <circle cx="50" cy="50" r="3" fill="#34D399"/>
    <circle cx="62" cy="56" r="3.5" fill="#22D3EE"/>
    <circle cx="22" cy="56" r="3" fill="#0EA5E9"/>
  </g>

  <!-- Typography -->
  <text x="105" y="58" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif" font-size="36" font-weight="900" letter-spacing="0.04em" fill="#0F172A" class="brand-text-dark">
    FROSH
  </text>
  <text x="245" y="58" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif" font-size="36" font-weight="900" letter-spacing="0.04em" fill="url(#hubGrad)">
    HUB
  </text>
  
  <!-- Subtitle / Tagline -->
  <text x="106" y="78" font-family="system-ui, -apple-system, Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="0.22em" fill="#0EA5E9" text-transform="uppercase">
    Digital Technology Platform
  </text>
</svg>
